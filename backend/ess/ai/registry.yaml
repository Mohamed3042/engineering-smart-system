# Curated model catalogue for Engineering Smart System (reviewed 2026-10-01).
#
# Tiers
#   frontier  – may run every task, including the critical ones (extraction, drawings, quotations)
#   standard  – may only classify mail
#   light     – never used: small/fast models that are prone to lower the quality
#   refused   – never used: deprecated/retired, wrong modality, no structured output, moving aliases
#
# Only IDs we are sure about are listed. Anything else that a provider lists is classified by the
# rules in ess/ai/registry.py (classify_unknown): non-chat modalities -> refused, small models ->
# light, otherwise standard + needs_evaluation. Every model – curated or not – must also pass the
# qualification exam (ess/ai/qualification.py) before it can run, see ess/ai/policy.py.
#
# request: hints for the engine (sampling = accepts temperature; thinking = adaptive|omit;
#          effort = accepts an effort level; reasoning = OpenAI reasoning model;
#          headroom = extra output tokens reserved for thinking/reasoning; api = responses_only)
version: 1
reviewed: "2026-10-01"

defaults:
  anthropic:
    capabilities: {structured_output: true, vision: true, tool_use: true, context_tokens: 1000000, pdf_input: true}
    request: {sampling: false, thinking: omit, effort: true, headroom: 8000}
  openai:
    capabilities: {structured_output: true, vision: true, tool_use: true, context_tokens: 400000, pdf_input: true}
    request: {sampling: false, reasoning: true, headroom: 8000}
  google:
    capabilities: {structured_output: true, vision: true, tool_use: true, context_tokens: 1048576, pdf_input: true}
    request: {sampling: true, headroom: 8000}

